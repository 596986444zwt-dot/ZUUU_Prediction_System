name: Public tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-unit-tests:
    name: Python 3.13 public unit tests
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - name: Check out public source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install public-test dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Run independent public unit tests
        run: >-
          python -B -m pytest -p no:cacheprovider
          tests/test_zuuu_metar_parser.py
          tests/test_zuuu_metar_temperature_parser.py
          tests/test_zuuu_time_normalizer.py
          tests/test_zuuu_observation_record.py
          tests/test_zuuu_raw_identity.py
          tests/test_zuuu_raw_archive.py
          -q
